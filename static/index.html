<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vynora Live 1v1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --bg-dark: #06040C;
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary-gradient: linear-gradient(135deg, #FF007A 0%, #7928CA 100%);
    --accent-cyan: #00F5D4;
    --text-main: #FFFFFF;
    --text-muted: #94A3B8;
    --gold: #FFD700;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 75px; }
.app-header { position: sticky; top: 0; z-index: 100; background: rgba(6, 4, 12, 0.95); backdrop-filter: blur(12px); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
.brand-logo { font-weight: 800; font-size: 1.15rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.wallet-badge { display: flex; align-items: center; gap: 6px; background: rgba(255, 215, 0, 0.12); border: 1px solid rgba(255, 215, 0, 0.3); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: var(--gold); cursor: pointer; }
.host-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
.host-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; }
.host-thumb { width: 100%; height: 185px; object-fit: cover; }
.host-info { padding: 10px; }
.call-btn { width: 100%; background: var(--primary-gradient); border: none; color: white; padding: 8px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 6px; }
#video-call-screen { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 999; display: none; flex-direction: column; }
#video-call-screen.active { display: flex; }
#main-video-view { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
#pip-video-view { position: absolute; top: 70px; right: 16px; width: 100px; height: 140px; background: #111; border-radius: 14px; overflow: hidden; border: 2px solid #FF007A; z-index: 5; }
.live-top-bar { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
.call-timer-badge { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 700; color: #00F5D4; }
</style>
</head>
<body>
<div class="app-header">
    <div class="brand-logo"><i class="fa-solid fa-gem"></i> Vynora Live</div>
    <div class="wallet-badge"><i class="fa-solid fa-coins"></i> <span id="user-token-count">0</span></div>
</div>

<div class="host-grid" id="hosts-container"></div>

<div id="video-call-screen">
    <div class="live-top-bar">
        <div class="call-timer-badge" id="call-timer-display">Connecting...</div>
        <div onclick="endCallSession()" style="background: #FF3B30; color: white; padding: 6px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;">End</div>
    </div>
    <div id="main-video-view"></div>
    <div id="pip-video-view"></div>
</div>

<script>
let tg = window.Telegram?.WebApp;
if (tg) tg.expand();
let currentUser = { user_id: tg?.initDataUnsafe?.user?.id || 123456789, tokens: 0 };
let currentBookingId = null;
let callTimerInterval = null;
let callDurationSecs = 0;
let agoraClient = null;
let localTracks = { videoTrack: null, audioTrack: null };

async function initApp() {
    let res = await fetch(`/api/user/${currentUser.user_id}`);
    let data = await res.json();
    currentUser.tokens = data.tokens;
    document.getElementById('user-token-count').innerText = data.tokens;
    loadHosts();
}

async function loadHosts() {
    let res = await fetch('/api/hosts');
    let data = await res.json();
    let container = document.getElementById('hosts-container');
    container.innerHTML = '';
    data.hosts.forEach(h => {
        container.innerHTML += `
            <div class="host-card" onclick="bookHost('${h.id}', '${h.name}', ${h.rate})">
                <img src="${h.img}" class="host-thumb">
                <div class="host-info">
                    <div style="font-weight:700;">${h.name}</div>
                    <div style="font-size:0.8rem; color:#94A3B8;">🪙 ${h.rate}/min</div>
                    <button class="call-btn">Call Now</button>
                </div>
            </div>
        `;
    });
}

async function bookHost(hostId, hostName, rate) {
    if(currentUser.tokens < rate) {
        alert("Insufficient tokens! Please recharge.");
        return;
    }
    let res = await fetch('/api/book-slot', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: currentUser.user_id, host_id: hostId, host_name: hostName, duration_mins: 1, token_cost: rate })
    });
    let data = await res.json();
    if(data.status === 'success') {
        currentBookingId = data.booking_id;
        alert("Booking sent! Waiting for host to accept...");
    } else {
        alert(data.message);
    }
}

async function startAgoraCall(channelName) {
    document.getElementById('video-call-screen').classList.add('active');
    document.getElementById('call-timer-display').innerText = "Connecting...";

    let res = await fetch(`/api/agora-token?channelName=${channelName}&uid=${currentUser.user_id}&role=publisher`);
    let data = await res.json();

    agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    
    // TIMER FIX: Timer starts ONLY when remote user joins & publishes stream
    agoraClient.on("user-published", async (user, mediaType) => {
        await agoraClient.subscribe(user, mediaType);
        if (mediaType === "video") {
            user.videoTrack.play("main-video-view");
        }
        if (mediaType === "audio") {
            user.audioTrack.play();
        }
        startCallTimer();
    });

    await agoraClient.join(data.appId, data.channel, data.token, data.uid);
    localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
    localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();
    localTracks.videoTrack.play("pip-video-view");
    await agoraClient.publish([localTracks.audioTrack, localTracks.videoTrack]);
}

function startCallTimer() {
    if(callTimerInterval) return;
    callDurationSecs = 0;
    document.getElementById('call-timer-display').innerText = "00:00";
    callTimerInterval = setInterval(() => {
        callDurationSecs++;
        let m = Math.floor(callDurationSecs / 60).toString().padStart(2, '0');
        let s = (callDurationSecs % 60).toString().padStart(2, '0');
        document.getElementById('call-timer-display').innerText = `${m}:${s}`;
    }, 1000);
}

async function endCallSession() {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    if(localTracks.audioTrack) localTracks.audioTrack.close();
    if(localTracks.videoTrack) localTracks.videoTrack.close();
    if(agoraClient) await agoraClient.leave();

    document.getElementById('video-call-screen').classList.remove('active');
    if(currentBookingId) {
        await fetch('/api/complete-booking', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ booking_id: currentBookingId, duration_secs: callDurationSecs })
        });
    }
    alert("Call ended. History saved!");
    location.reload();
}

initApp();
</script>
</body>
</html>
